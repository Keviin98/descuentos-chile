const MSG_WA="Hola! Vi la página de Descuentos Chile y quiero consultar por un producto: ";
const CONTACTO='<div class="cta"><div><b>¿Dudas, ideas o quieres que sigamos un producto?</b><div class="mut">Escríbenos y te respondemos.</div></div><div class="ctas">'+
 (WHATSAPP?'<a class="ctab wa" href="https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(MSG_WA)+'" target="_blank" rel="noopener">'+SVG_WA+'WhatsApp</a>':'')+
 '<a class="ctab ig" href="https://www.instagram.com/descuentoschile.cl" target="_blank" rel="noopener">'+SVG_IG+'Instagram</a></div></div>';
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function info(d){
 const pts=d.p,ult=pts[pts.length-1],ef=efect(ult),efs=pts.map(efect),min=Math.min(...efs),max=Math.max(...efs);
 let prev=null;for(let i=pts.length-2;i>=0;i--){if(efect(pts[i])!==ef){prev=efect(pts[i]);break}}
 const dto=ult[1]&&ult[2]&&ult[1]>ult[2]?Math.round((ult[1]-ult[2])/ult[1]*100):0;
 let et,k;
 if(ef<=min&&max>min){et="Mínimo detectado";k="min"}
 else if(dto>=5){et="-"+dto+"%";k="baja"}
 else if(prev!=null&&ef>prev){et="Subió";k="sube"}
 else if(prev!=null&&ef<prev){et="Bajó";k="baja"}
 else{et="Estable";k="neutro"}
 return {ef,min,dto,et,k,normal:ult[1]>ef?ult[1]:0,ord:dto};
}
function spark(d){
 const pts=d.p.slice(-30),v=pts.map(efect),lo=Math.min(...v),hi=Math.max(...v),n=pts.length;
 if(n<2)return"";const y=x=>hi===lo?18:33-(x-lo)/(hi-lo)*30;
 return '<svg viewBox="0 0 120 36" width="100%" height="36" preserveAspectRatio="none"><polyline points="'+pts.map((q,i)=>(3+i*114/(n-1)).toFixed(1)+","+y(efect(q)).toFixed(1)).join(" ")+'" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
function tarjeta(d){
 const i=d.i,c=COL[d.t]||COL.Otras;
 const tg={min:"background:#FACC15;color:#0F172A",baja:"background:#C81E45;color:#fff",sube:"background:#334155;color:#F1F5F9",neutro:"background:#334155;color:#F1F5F9"}[i.k];
 return '<div class="pc"><div class="r"><span class="tag" style="background:'+c[0]+';color:'+c[1]+'">'+esc(d.t)+'</span><span class="tag" style="'+tg+'">'+i.et+'</span></div>'+
 '<div class="ph">'+(d.img?'<img loading="lazy" src="'+esc(d.img)+'" alt="" onerror="this.style.display=\'none\'">':'')+'</div>'+
 '<div class="nm">'+esc(d.n)+'</div><div class="pr"><b>'+clp(i.ef)+'</b>'+(i.normal?'<s>'+clp(i.normal)+'</s>':'')+'</div>'+spark(d)+
 '<div class="mn">Más bajo detectado: '+clp(i.min)+'</div><a class="vb" href="#'+d.id+'">Ver historial</a></div>';
}
let evTimer=null;
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function evRango(a,b){const A=a.slice(0,10).split("-").map(Number),B=b.slice(0,10).split("-").map(Number);
 if(a.slice(0,10)===b.slice(0,10))return A[2]+" "+MES[A[1]-1]+" "+A[0];
 if(A[1]===B[1]&&A[0]===B[0])return A[2]+"–"+B[2]+" "+MES[A[1]-1]+" "+A[0];
 return A[2]+" "+MES[A[1]-1]+" – "+B[2]+" "+MES[B[1]-1]+" "+B[0]}
function evBox(ms){const s=Math.max(0,Math.floor(ms/1000));const v=[[Math.floor(s/86400),"días"],[Math.floor(s%86400/3600),"horas"],[Math.floor(s%3600/60),"min"],[s%60,"seg"]];
 return '<div class="cd">'+v.map(x=>'<div><b>'+p2(x[0])+'</b><span>'+x[1]+'</span></div>').join("")+'</div>'}
function eventos(){
 clearInterval(evTimer);const el=$("#ev");if(!el)return;
 const l=EVENTOS.map(e=>Object.assign({a:Date.parse(e.s),b:Date.parse(e.e)},e)).filter(e=>e.b>Date.now()).slice(0,4);
 if(!l.length){el.innerHTML="";return}
 el.innerHTML='<h2>Próximos eventos</h2><div class="evs">'+l.map((e,i)=>'<div class="evc'+(e.f?' hl':'')+'" id="ev'+i+'"><h3>'+esc(e.n)+'<span class="tg" id="tg'+i+'"></span></h3><div class="dt">'+evRango(e.s,e.e)+(e.c?'':' · fecha por confirmar')+'</div><div id="cv'+i+'"></div>'+(e.d?'<div class="ds">'+esc(e.d)+'</div>':'')+'</div>').join("")+'</div>';
 function tick(){
  if(!$("#ev")){clearInterval(evTimer);return}
  const now=Date.now();
  l.forEach((e,i)=>{const c=$("#cv"+i),t=$("#tg"+i),card=$("#ev"+i);if(!c)return;
   const en=now>=e.a&&now<=e.b,falta=e.a-now;
   card.classList.toggle("on",en);t.className="tg"+(en?" live":"");t.textContent=en?"¡EN CURSO!":"";
   if(en)c.innerHTML='<div class="lb">Termina en</div>'+evBox(e.b-now);
   else if(e.f||falta<7*864e5)c.innerHTML='<div class="lb">Empieza en</div>'+evBox(falta);
   else{const d=Math.ceil(falta/864e5);c.innerHTML='<div class="lb">Faltan</div><div class="big">'+d+' <small>'+(d===1?'día':'días')+'</small></div>'}});
 }
 tick();evTimer=setInterval(tick,1000);
}
function home(){
 DATA.forEach(d=>{d.i=info(d)});
 const tiendas={};DATA.forEach(d=>tiendas[d.t]=(tiendas[d.t]||0)+1);
 const orden=Object.keys(tiendas).sort((a,b)=>(a==="Otras")-(b==="Otras")||tiendas[b]-tiendas[a]);
 const desde=Math.min(...DATA.map(d=>d.p[0][0]));const nt=orden.filter(t=>t!=="Otras").length;
 const chips='<button class="chip all'+(ST.tienda==="Todas"?" on":"")+'" data-t="Todas" style="background:#F1F5F9;color:#0F172A">Todas <em>'+DATA.length+'</em></button>'+
  orden.map(t=>{const c=COL[t]||COL.Otras;return '<button class="chip'+(ST.tienda===t?" on":"")+'" data-t="'+esc(t)+'" style="background:'+c[0]+';color:'+c[1]+';'+(ST.tienda===t?'box-shadow:0 0 0 3px '+c[0]:'')+'"><i>'+(LOGOS[t]?'<img src="'+LOGOS[t]+'" alt="">':esc(t[0]))+'</i>'+esc(t)+' <em>'+tiendas[t]+'</em></button>'}).join("");
 $("#app").innerHTML='<div class="hd"><svg width="34" height="34" viewBox="0 0 34 34"><rect width="34" height="34" rx="9" fill="#C81E45"/><path d="M9 22l6-6 4 4 7-8" fill="none" stroke="#FACC15" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Descuentos Chile</b></div>'+
 '<div class="hero"><span class="pill">Historial de precios real</span><h1>Compra cuando el precio <span>realmente baje</span>.</h1>'+
 '<p class="lead">Guardamos el historial de precios de tus tiendas favoritas, para que veas cuándo un producto está barato de verdad y no te lleves sorpresas.</p>'+
 '<div class="stats"><div class="st"><b>'+DATA.length+'</b><span>productos</span></div><div class="st"><b>'+nt+'</b><span>tiendas</span></div><div class="st"><b>'+fdl(desde)+'</b><span>historial desde</span></div><div class="st"><b>'+GENERADO+'</b><span>última actualización</span></div></div></div>'+
 '<div id="ev"></div>'+'<h2>Elige tu tienda</h2><div class="chips" id="ch">'+chips+'</div>'+
 '<div class="bar"><input id="q" placeholder="Buscar producto o marca..." value="'+esc(ST.q)+'"><select id="od"><option value="desc">Mayor descuento primero</option><option value="asc">Precio: menor a mayor</option><option value="az">Nombre A-Z</option></select></div>'+
 '<div id="gr"></div>'+CONTACTO+AVISO_HOME;
 $("#od").value=ST.orden;
 document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ST.tienda=b.dataset.t;ST.n=24;home()});
 $("#q").oninput=e=>{ST.q=e.target.value;ST.n=24;grilla()};
 $("#od").onchange=e=>{ST.orden=e.target.value;ST.n=24;grilla()};
 grilla();eventos();
}
function grilla(){
 const q=ST.q.toLowerCase();
 let l=DATA.filter(d=>(ST.tienda==="Todas"||d.t===ST.tienda)&&(d.n+" "+d.m+" "+d.id).toLowerCase().includes(q));
 const o=ST.orden;
 l.sort(o==="asc"?(a,b)=>a.i.ef-b.i.ef:o==="desc2"?(a,b)=>b.i.ef-a.i.ef:o==="az"?(a,b)=>a.n.localeCompare(b.n,"es"):(a,b)=>b.i.ord-a.i.ord||a.n.localeCompare(b.n,"es"));
 const g=$("#gr");
 if(!l.length){g.innerHTML='<div class="empty">No encontramos productos con ese filtro.</div>';return}
 g.innerHTML='<div class="grid">'+l.slice(0,ST.n).map(tarjeta).join("")+'</div>'+(l.length>ST.n?'<button class="more" id="mas">Mostrar más ('+(l.length-ST.n)+' restantes)</button>':'');
 const m=$("#mas");if(m)m.onclick=()=>{ST.n+=24;grilla()};
}
function ficha(d){
 const pts=d.p;const ult=pts[pts.length-1];const primero=pts[0][0];
 const dias=Math.max(1,Math.round((Date.now()-primero)/864e5));
 const minimo=Math.min(...pts.map(efect));
 const insignia=efect(ult)<=minimo?"🏆 Precio más bajo detectado":"Mínimo detectado: "+clp(minimo);
 $("#app").innerHTML='<div class="fw"><a href="#" class="back">← Volver al catálogo</a>'+
 '<div class="card" style="margin-top:12px"><div class="top">'+(d.img?'<img src="'+esc(d.img)+'" alt="" onerror="this.style.display=\'none\'">':'')+'<div><h1 class="f">'+esc(d.n)+'</h1><div class="sub">'+esc(d.t)+(d.m?' · '+esc(d.m):'')+'</div></div></div>'+
 '<div class="badge">'+insignia+'</div><div style="margin-top:8px">Último precio: <b>'+clp(efect(ult))+'</b> <span class="mut">(verificado el '+fd(ult[0],true)+')</span></div>'+
 '<a class="btn" href="'+esc(d.l)+'" target="_blank" rel="noopener">👉 Ver producto en la tienda</a></div>'+
 '<div class="card"><div class="rng"><button data-d="7" class="on">7 días</button><button data-d="30">30 días</button><button data-d="90">3 meses</button><button data-d="0">Todo</button></div><div class="cv"><canvas id="c"></canvas></div>'+
 '<div class="desde" id="ds"></div></div>'+
 '<div class="card"><b>Últimas lecturas</b><table id="tb"></table></div><div class="sub">Datos actualizados al '+GENERADO+'</div>'+AVISO+'</div>';
 const dibuja=nd=>{
  const desde=nd?Date.now()-nd*864e5:0;let sel=pts.filter(x=>x[0]>=desde);
  if(nd){const antes=pts.filter(x=>x[0]<desde);if(antes.length){const a=antes[antes.length-1];sel=[[desde,a[1],a[2],a[3]]].concat(sel)}}
  if(sel.length<2)sel=pts.slice(-2);
  const serie=(i,nom,col)=>({label:nom,data:sel.filter(x=>x[i]!=null).map(x=>({x:x[0],y:x[i]})),borderColor:col,backgroundColor:col,stepped:"after",pointRadius:2,borderWidth:2});
  const ds=[serie(1,"Precio Normal","#FACC15"),serie(2,"Precio Oferta","#e94560")];
  if(sel.some(x=>x[3]!=null))ds.push(serie(3,"Con Tarjeta","#38BDF8"));
  if(chart)chart.destroy();
  chart=new Chart($("#c"),{type:"line",data:{datasets:ds.filter(s=>s.data.length)},options:{responsive:true,maintainAspectRatio:false,parsing:false,
   scales:{x:{type:"linear",ticks:{color:"#94A3B8",maxTicksLimit:6,callback:v=>fd(v)},grid:{color:"#334155"}},y:{ticks:{color:"#94A3B8",callback:v=>clp(v)},grid:{color:"#334155"}}},
   plugins:{legend:{labels:{color:"#F1F5F9"}},tooltip:{callbacks:{title:i=>fd(i[0].parsed.x,true),label:c=>c.dataset.label+": "+clp(c.parsed.y)}}}}});
  const rango=nd||99999;const corto=nd&&dias<nd;
  $("#ds").innerHTML='📅 Monitoreamos este producto desde el <b>'+fdl(primero)+'</b> ('+dias+(dias===1?' día':' días')+' de historial).'+(corto?' Por eso el gráfico muestra menos que el período elegido: no es que falten datos, el producto es relativamente nuevo en nuestro seguimiento.':'');
 };
 dibuja(7);
 document.querySelectorAll(".rng button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".rng button").forEach(x=>x.classList.remove("on"));b.classList.add("on");dibuja(+b.dataset.d)});
 const filas=[];let prev=null;for(const x of pts){const k=x[1]+"|"+x[2]+"|"+x[3];if(k!==prev)filas.push(x);prev=k}
 const ultimas=filas.slice(-40).reverse();
 $("#tb").innerHTML='<tr><th>Fecha</th><th>Normal</th><th>Oferta</th><th>Tarjeta</th></tr>'+ultimas.map(x=>'<tr><td>'+fd(x[0],true)+'</td><td>'+clp(x[1])+'</td><td>'+clp(x[2])+'</td><td>'+clp(x[3])+'</td></tr>').join("");
}
function ruta(){const id=decodeURIComponent(location.hash.slice(1));const d=DATA.find(x=>x.id===id);d?ficha(d):home();window.scrollTo(0,0)}
window.onhashchange=ruta;ruta();
</script></body></html>
